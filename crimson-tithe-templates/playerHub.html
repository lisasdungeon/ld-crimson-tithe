<form class="crimson-tithe-player-hub-form">
  <header class="crimson-tithe-player-hub-header">
    <img class="ct-player-portrait" src="{{actorImg}}" alt="{{actorName}}" />
    <h2 class="ct-player-name">{{actorName}}</h2>
    <button type="button" class="close" title="{{closeTitle}}"><i class="fas fa-times"></i></button>
  </header>

  <section class="ct-player-body">
    <div class="ct-player-cp-row">
      <span class="ct-cp-icon"><i class="fas fa-coins"></i></span>
      <span class="ct-cp-label">{{cpLabel}}</span>
      <span class="ct-cp-value">{{cp}}</span>
    </div>
    <p class="ct-player-hint">{{hint}}</p>
  </section>
</form>
