<form class="crimson-tithe-pop-up-form">
  <header class="crimson-tithe-pop-up-header">
    <h1>{{localize "CT.popUp.header"}}</h1>
    <button type="button" class="crimson-tithe-popup-close" title="{{localize "CT.common.closeButtonTitle"}}"><i class="fas fa-times"></i></button>
  </header>

  <section class="crimson-tithe-popup-body">
    <img src="{{imagePath}}" alt="Crimson Point Icon" class="crimson-tithe-popup-image"/>
    <p class="crimson-tithe-popup-phrase">{{phraseText}}</p>
  </section>
</form>
